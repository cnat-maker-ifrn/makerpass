name: CI Makerpass

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ] 

jobs:
  
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt
      
      - name: Análise Estática com Bandit voltada para segurança
        run: |
          bandit -r  makerpass  -ll --format txt

      - name: Lint rápido com Ruff
        uses: astral-sh/ruff-action@v1
        with:
          args: "check --verbose"

      - name: Verificar Padrão de Código com Pylint
        run: pylint  makerpass 
          
      - name: Verificar dependências deprecadas
        run: |
          pip install deprecated-checker
          deprecated-checker check 

      - name: Verificar código potencialmente deprecado
        run: |
          pip install vulture
          vulture . --min-confidence 80 

      - name: Executar OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'makerpass-project'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            
      - name: Upload do Relatório de Scan
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

      - name: Instalar Graphviz (Dependência do Sistema)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Gerar Diagrama de Classes UML
        run: |
          python manage.py graph_models  makerpass  -o diagrama_classes.png

      - name: Upload do Diagrama como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: diagrama-uml-classes
          path: diagrama_classes.png

      - name: Gerar Certificados SSL Temporários
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem -days 1 -nodes -subj "/CN=localhost"

      - name: Teste de Integração HTTPS (RunServerPlus)
        run: |
          nohup python manage.py runserver_plus --cert-file certs/cert.pem --key-file certs/key.pem > server.log 2>&1 &
          SERVER_PID=$!
          
          echo "Servidor iniciado com PID $SERVER_PID. Aguardando disponibilidade..."

          curl -v -k -f --retry 10 --retry-delay 2 --retry-connrefused https://127.0.0.1:8000/makerpass
          
          CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Falha no teste HTTPS. Logs do servidor:"
            cat server.log
            exit 1
          fi

          kill $SERVER_PID

  analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3















